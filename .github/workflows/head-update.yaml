name: Build
on:
  push:
    branches:
      - master
      - 'release-v*'
  pull_request:

jobs:
  build:
    if: ${{ github.repository == 'gardener/gardener-extension-os-coreos' }}
    uses: ./.github/workflows/build.yaml
    with:
      mode: snapshot
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
